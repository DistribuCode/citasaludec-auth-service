openapi: 3.0.0
info:
  title: Auth Service API
  version: 1.0.0
paths:
  /auth/login:
    post:
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: JWT Token returned
        '401':
          description: Invalid credentials
